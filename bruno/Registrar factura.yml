info:
  name: Registrar factura
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:3000/facturas
  body:
    type: json
    data: |-
      {
        "cedula": "0912345678",
        "numeroFactura": "001-001-000000999",
        "rucProveedor": "1790012345001",
        "total": 15.00
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false